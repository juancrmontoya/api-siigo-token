<div id="toast"></div>
<script>
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(Number(n) || 0);
  const fNum = n => new Intl.NumberFormat('es-CO', { maximumFractionDigits: 1 }).format(Number(n) || 0);
  const fFecha = iso => iso ? new Date(iso).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const fDia = iso => iso ? new Date(iso).toLocaleDateString('es-CO', { dateStyle: 'medium' }) : '';
  const hoyISO = (offsetDias) => { const d = new Date(Date.now() + (offsetDias || 0) * 86400000); return d.toLocaleDateString('en-CA'); };

  /** google.script.run como Promise. */
  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e instanceof Error ? e : new Error(String(e && e.message || e))))[fn].apply(null, args);
    });
  }

  function toast(msg, tipo) {
    const el = document.createElement('div');
    el.className = 'toast ' + (tipo || '');
    el.textContent = msg;
    $('#toast').appendChild(el);
    setTimeout(() => el.remove(), tipo === 'err' ? 6000 : 3200);
  }

  const store = {
    get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* almacenamiento no disponible */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* sin acción */ } },
  };

  async function copiar(texto) {
    try { await navigator.clipboard.writeText(texto); toast('Copiado al portapapeles', 'ok'); return; } catch (e) { /* fallback */ }
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copiado al portapapeles', 'ok'); } catch (e) { prompt('Copia el texto:', texto); }
    ta.remove();
  }

  function abrir(url) { window.open(url, '_blank', 'noopener'); }

  function badge(estado) {
    const lbl = (BOOT.estados && BOOT.estados[estado]) || estado;
    return '<span class="badge b-' + esc(estado) + '">' + esc(lbl) + '</span>';
  }

  function modal(html, opciones) {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal" style="max-width:' + ((opciones && opciones.ancho) || 640) + 'px">' + html + '</div>';
    ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) ov.remove(); });
    document.body.appendChild(ov);
    return { el: ov.firstChild, cerrar: () => ov.remove() };
  }

  function confirmar(mensaje, conMotivo) {
    return new Promise(resolve => {
      let done = false;
      const fin = v => { if (!done) { done = true; resolve(v); } };
      const m = modal('<h3>Confirmar</h3><p>' + esc(mensaje) + '</p>' +
        (conMotivo ? '<label>Motivo / nota</label><textarea id="cf-nota"></textarea>' : '') +
        '<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="cf-ok">Confirmar</button></div>', { ancho: 440 });
      const ov = m.el.parentNode;
      ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) fin(null); });
      $('#cf-ok', m.el).onclick = () => { const v = conMotivo ? $('#cf-nota', m.el).value.trim() : true; m.cerrar(); fin(v); };
    });
  }

  /** Misma regla de envío que el servidor (Orders.js > calcularTotales_). */
  function calcularTotales(lineas, cfg, entregaTipo) {
    let subtotal = 0, personalizado = 0, requiereTarifa = false;
    lineas.forEach(l => {
      subtotal += l.precio * l.cantidad;
      if (entregaTipo === 'DOMICILIO') {
        if (l.envioTipo === 'PERSONALIZADO') personalizado += (Number(l.envioValor) || 0) * l.cantidad;
        if (l.envioTipo === 'EXCLUIDO') requiereTarifa = true;
      }
    });
    let envio = entregaTipo === 'DOMICILIO' ? personalizado + (requiereTarifa ? Number(cfg.tarifaDomicilio) || 0 : 0) : 0;
    const gratis = Number(cfg.envioGratisDesde) || 0;
    if (gratis > 0 && subtotal >= gratis) envio = 0;
    return { subtotal, envio, total: subtotal + envio };
  }

  /** Texto plano del pedido para copiar / WhatsApp / correo. */
  function textoPedido(p, items, negocio, url) {
    const l = [];
    l.push('*Pedido ' + p.id + '* - ' + (negocio || ''));
    if (p.fecha) l.push('Fecha: ' + fFecha(p.fecha));
    l.push('Cliente: ' + p.nombre + (p.telefono ? ' (' + p.telefono + ')' : ''));
    l.push(p.entregaTipo === 'DOMICILIO' ? 'Entrega a domicilio: ' + p.direccion : 'Recoge en el punto de venta');
    l.push('');
    items.forEach(i => l.push('• ' + i.cantidad + ' x ' + i.nombre + (i.presentacion ? ' (' + i.presentacion + ')' : '') + ' = ' + fmt(i.precio * i.cantidad)));
    l.push('');
    l.push('Subtotal: ' + fmt(p.subtotal));
    l.push('Envío: ' + fmt(p.envio));
    l.push('*Total: ' + fmt(p.total) + '*');
    if (p.notas) l.push('Notas: ' + p.notas);
    if (url) { l.push(''); l.push('Consulta el estado aquí: ' + url); }
    return l.join('\n');
  }

  function urlWhatsApp(texto, numero) {
    return 'https://wa.me/' + (numero ? String(numero).replace(/\D/g, '') : '') + '?text=' + encodeURIComponent(texto);
  }

  function urlCorreo(para, asunto, cuerpo) {
    return 'mailto:' + encodeURIComponent(para || '') + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo.replace(/\*/g, ''));
  }

  /** Redimensiona una imagen en el navegador antes de subirla (ahorra cuota y tiempo). */
  function leerImagen(file, max) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = reject;
      fr.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const k = Math.min(1, (max || 1000) / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
          const data = c.toDataURL('image/jpeg', 0.82);
          resolve({ base64: data.split(',')[1], mime: 'image/jpeg', preview: data });
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
</script>
